name: ICBC Gold Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Diagnose connectivity
        run: |
          echo "--- ICBC target page ---"
          curl -sS -o /dev/null -w "ICBC: HTTP %{http_code}, %{time_total}s\n" --max-time 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://cmbcnp.icbc.com.cn/icbc/newperbank/perbank3/gold/goldaccrual_query_out.jsp" || echo "ICBC: CURL FAILED ($?)"
          echo "--- China site baseline ---"
          curl -sS -o /dev/null -w "Baidu: HTTP %{http_code}, %{time_total}s\n" --max-time 15 "https://www.baidu.com" || echo "Baidu: CURL FAILED ($?)"
          curl -sS -o /dev/null -w "ICBC main: HTTP %{http_code}, %{time_total}s\n" --max-time 15 "https://www.icbc.com.cn" || echo "ICBC main: CURL FAILED ($?)"

      - name: Run monitor
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python monitor.py --once

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --staged --quiet 2>/dev/null; then
            echo "No state changes, skip commit"
          else
            git commit -m "update state [skip ci]"
            git push
          fi
