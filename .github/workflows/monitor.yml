name: ICBC Gold Monitor

# 监控已迁移至华为云 FunctionGraph(每分钟执行),此工作流仅保留手动测试入口
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: '发送测试邮件(验证邮箱链路)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python monitor.py --test-email
          else
            python monitor.py --once || (echo "first attempt failed, retrying in 90s..." && sleep 90 && python monitor.py --once)
          fi

      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --staged --quiet 2>/dev/null; then
            echo "No state changes, skip commit"
          else
            git commit -m "update state [skip ci]"
            git push
          fi
